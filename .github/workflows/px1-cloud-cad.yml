name: PX1 cloud CAD master build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'current/CAD/**'
      - 'current/HOLD_REGISTER.json'
      - 'scripts/cloud/**'
      - '.github/workflows/px1-cloud-cad.yml'

permissions:
  contents: read

jobs:
  build:
    name: CadQuery full assembly and collision report
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CadQuery
        run: python -m pip install 'cadquery==2.7.0' pillow
      - name: Build real STEP, registry and CAD-derived outline
        env:
          PX1_CLOUD_OUT: ${{ runner.temp }}/px1_cloud
        run: bash scripts/cloud/build_current.sh
      - name: Verify nominal pipe contact and solid bounds
        run: python scripts/cloud/check_pipe_pose.py --active --mesh "${{ runner.temp }}/px1_cloud/images/assembly_mesh.json.gz" --out "${{ runner.temp }}/px1_cloud/pipe_verification.json"
      - name: Verify exported STEP and sampled gear motion
        run: python scripts/cloud/check_integrated.py "${{ runner.temp }}/px1_cloud" --roundtrip --require-pipe-service
      - name: Render actual CAD surfaces
        if: always()
        run: python scripts/cloud/render_model.py "${{ runner.temp }}/px1_cloud"
      - name: Upload geometry, QA and view (even if build fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: px1-cloud-cad-build
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/px1_cloud/CAD/PX1_Current_Master.step
            ${{ runner.temp }}/px1_cloud/PX1_Current_Validation.json
            ${{ runner.temp }}/px1_cloud/component_registry.json
            ${{ runner.temp }}/px1_cloud/cloud_build_summary.json
            ${{ runner.temp }}/px1_cloud/integrated_checks.json
            ${{ runner.temp }}/px1_cloud/pipe_verification.json
            ${{ runner.temp }}/px1_cloud/images/*.png
            ${{ runner.temp }}/px1_cloud/images/render_manifest.json
            ${{ runner.temp }}/px1_cloud/px1_side_envelope.svg
            ${{ runner.temp }}/px1_cloud/logs/*.log
