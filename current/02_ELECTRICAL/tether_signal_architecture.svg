<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650"><rect width="1280" height="650" fill="#f8fafc"/><text x="50" y="55" font-size="29" font-family="sans-serif" font-weight="bold">PX1 | 40 m / six-core tether interface</text><text x="50" y="88" font-size="17" font-family="sans-serif" fill="#9b4b13">DESIGN ASSUMPTIONS — NOT A VERIFIED TRANSMISSION LINE</text><rect x="50" y="120" width="340" height="470" rx="12" fill="#e5edf5" stroke="#66788a"/><text x="70" y="157" font-size="23" font-family="sans-serif">Six copper cores</text><text x="70" y="193" font-size="16" font-family="sans-serif">40 m, no coax, no twisted pair</text><g font-family="sans-serif"><text x="70" y="280" font-size="16">1: DC +24V</text><text x="70" y="308" font-size="16">2: DC return</text><text x="70" y="336" font-size="16">3: RS485 A</text><text x="70" y="364" font-size="16">4: RS485 B</text><text x="70" y="392" font-size="16">5: CVBS signal</text><text x="70" y="420" font-size="16">6: CVBS return</text></g><rect x="430" y="120" width="800" height="180" rx="12" fill="#e7f2e9" stroke="#6b8970"/><g font-family="sans-serif" font-size="19"><text x="455" y="158">Power: 24 V / 3.7 A / 2.5 mm² @ 60 °C</text><text x="455" y="194">Load voltage: 21.60 V; cable loss: 8.87 W</text><text x="455" y="230">RS485 one-way delay: 0.20 µs / 8.68 µs bit</text><text x="455" y="265" fill="#a23a2a">RS485 BER, EMI and CVBS quality: NOT_RUN</text></g><rect x="430" y="322" width="800" height="268" rx="12" fill="#f3eee7" stroke="#99836c"/><g font-family="sans-serif"><text x="455" y="355" font-size="20">CVBS lumped RC sensitivity (NOT picture-quality prediction)</text><text x="455" y="380" font-size="15">12 cases: 40–150 pF/m × 0.25–1.0 mm² video return</text><line x1="600" y1="525" x2="1210" y2="525" stroke="#333"/><line x1="600" y1="325" x2="600" y2="525" stroke="#333"/><rect x="620" y="437.2" width="28" height="87.8" fill="#3984aa"/><rect x="669" y="434.3" width="28" height="90.7" fill="#3984aa"/><rect x="718" y="432.8" width="28" height="92.2" fill="#3984aa"/><rect x="767" y="471.2" width="28" height="53.8" fill="#3984aa"/><rect x="816" y="469.2" width="28" height="55.8" fill="#3984aa"/><rect x="865" y="468.1" width="28" height="56.9" fill="#3984aa"/><rect x="914" y="486.7" width="28" height="38.3" fill="#3984aa"/><rect x="963" y="485.1" width="28" height="39.9" fill="#3984aa"/><rect x="1012" y="484.3" width="28" height="40.7" fill="#3984aa"/><rect x="1061" y="499.2" width="28" height="25.8" fill="#3984aa"/><rect x="1110" y="498.1" width="28" height="26.9" fill="#3984aa"/><rect x="1159" y="497.6" width="28" height="27.4" fill="#3984aa"/><text x="610" y="562" font-size="15">Scenario index (capacitance × return area)</text></g><text x="50" y="625" font-family="sans-serif" font-size="16">PASS: arithmetic screen | PHYSICAL_CHECK: cable, video, RS485, gland, pressure</text></svg>