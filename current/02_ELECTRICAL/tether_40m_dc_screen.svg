<rect width="940" height="570" fill="#f7f9fc"/>
<text x="36" y="46" font-size="25" font-family="sans-serif" font-weight="bold">PX1 / 40 m / 6-core copper tether</text>
<text x="36" y="75" font-size="15" font-family="sans-serif">Engineering screening: 24 V, assumed copper 0.0175 ohm mm2/m at 20 C; NOT measured cable</text>
