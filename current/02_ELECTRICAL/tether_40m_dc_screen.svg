<circle cx="54" cy="155" r="11" fill="#475569"/><line x1="72" y1="155" x2="310" y2="155" stroke="#475569" stroke-width="5"/><text x="332" y="160" font-family="sans-serif" font-size="16">2  DC return</text>
<circle cx="54" cy="198" r="11" fill="#2563eb"/><line x1="72" y1="198" x2="310" y2="198" stroke="#2563eb" stroke-width="5"/><text x="332" y="203" font-family="sans-serif" font-size="16">3  RS485 A</text>
