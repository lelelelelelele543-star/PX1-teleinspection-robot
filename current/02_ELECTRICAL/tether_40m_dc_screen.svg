<text x="36" y="416" font-family="sans-serif" font-size="18" font-weight="bold">DC drop: two 40 m power conductors, 2 A</text>
<text x="40" y="450" font-family="sans-serif" font-size="13">0.5 mm2</text><rect x="128" y="437" width="300.0" height="14" fill="#c26b26"/><text x="440.0" y="450" font-family="sans-serif" font-size="13">5.60 V drop / 18.40 V load</text>
<text x="40" y="473" font-family="sans-serif" font-size="13">0.75 mm2</text><rect x="128" y="460" width="200.0" height="14" fill="#c26b26"/><text x="340.0" y="473" font-family="sans-serif" font-size="13">3.73 V drop / 20.27 V load</text>
<text x="40" y="496" font-family="sans-serif" font-size="13">1 mm2</text><rect x="128" y="483" width="150.0" height="14" fill="#c26b26"/><text x="290.0" y="496" font-family="sans-serif" font-size="13">2.80 V drop / 21.20 V load</text>
<text x="40" y="519" font-family="sans-serif" font-size="13">1.5 mm2</text><rect x="128" y="506" width="100.0" height="14" fill="#c26b26"/><text x="240.0" y="519" font-family="sans-serif" font-size="13">1.87 V drop / 22.13 V load</text>
<text x="40" y="542" font-family="sans-serif" font-size="13">2.5 mm2</text><rect x="128" y="529" width="60.0" height="14" fill="#c26b26"/><text x="200.0" y="542" font-family="sans-serif" font-size="13">1.12 V drop / 22.88 V load</text>
<text x="535" y="143" font-family="sans-serif" font-size="18" font-weight="bold">Unverified interfaces</text>
<text x="535" y="180" font-family="sans-serif" font-size="15">- Core cross-sections and temperature</text>
<text x="535" y="214" font-family="sans-serif" font-size="15">- DC load current and converter UVLO</text>
<text x="535" y="248" font-family="sans-serif" font-size="15">- RS485 EMC without twisted pair</text>
<text x="535" y="282" font-family="sans-serif" font-size="15">- CVBS impedance and attenuation</text>
<text x="535" y="316" font-family="sans-serif" font-size="15">- Pressure gland and strain relief</text>
<text x="535" y="350" font-family="sans-serif" font-size="15">- Kevlar, bend radius and reel capacity</text>
<text x="535" y="414" font-family="sans-serif" font-size="14">PASS: arithmetic self-tests only</text><text x="535" y="439" font-family="sans-serif" font-size="14">NOT_RUN: video/EMC/heating/pressure</text><text x="535" y="464" font-family="sans-serif" font-size="14">PHYSICAL_CHECK: assembled 40 m cable</text></svg>