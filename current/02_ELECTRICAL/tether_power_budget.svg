<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650"><rect width="1080" height="650" fill="#f8fafc"/><text x="35" y="45" font-family="sans-serif" font-size="25" font-weight="bold">PX1 / 40 m / integrated 24 V power screening</text><text x="35" y="72" font-family="sans-serif" font-size="14">ALL loads, copper sizes, 21 V limit and temperatures are DESIGN ASSUMPTIONS, not validated hardware</text><rect x="32" y="98" width="480" height="184" rx="12" fill="#e2e8f0"/><text x="52" y="128" font-family="sans-serif" font-size="18" font-weight="bold">Load allocation at 24 V (assumed)</text><text x="54" y="156" font-family="monospace" font-size="14">traction_left            0.65 A</text><text x="54" y="177" font-family="monospace" font-size="14">traction_right           0.65 A</text><text x="54" y="198" font-family="monospace" font-size="14">camera_video             0.18 A</text><text x="54" y="219" font-family="monospace" font-size="14">illumination             0.32 A</text><text x="54" y="240" font-family="monospace" font-size="14">controller_rs485         0.12 A</text><text x="54" y="261" font-family="monospace" font-size="14">reserve                  0.08 A</text><text x="560" y="125" font-family="sans-serif" font-size="18" font-weight="bold">Architecture: six independent copper cores</text><text x="560" y="159" font-family="sans-serif" font-size="15">1: +24 V      2: power return</text><text x="560" y="190" font-family="sans-serif" font-size="15">3: RS485 A     4: RS485 B</text><text x="560" y="221" font-family="sans-serif" font-size="15">5: CVBS signal 6: CVBS return</text><text x="560" y="253" font-family="sans-serif" font-size="14">No coax / twisted pair / fiber assumed</text><text x="35" y="324" font-family="sans-serif" font-size="18" font-weight="bold">Round-trip copper loss over 40 m, two power conductors</text><text x="40" y="356" font-family="monospace" font-size="14">Core area  Temp  Current  Loop R  Drop    Robot V  Heat   Voltage target</text><rect x="