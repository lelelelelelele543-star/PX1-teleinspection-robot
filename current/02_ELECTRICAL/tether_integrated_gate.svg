<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570"><rect width="1120" height="570" fill="#f8fafc"/><text x="30" y="45" font-size="26" font-family="Arial">PX1 / 40 m / six-core integrated interface</text><text x="30" y="75" font-size="16" fill="#a33" font-family="Arial">PARAMETER-DERIVED 2D SCREEN — ASSUMPTIONS, NOT CAD / NOT VERIFIED SIGNAL INTEGRITY</text><rect x="30" y="115" width="190" height="335" rx="12" fill="#e2e8f0" stroke="#334155"/><rect x="900" y="115" width="190" height="335" rx="12" fill="#e2e8f0" stroke="#334155"/><text x="45" y="150" font-size="20" font-family="Arial">Console / reel</text><text x="930" y="150" font-size="20" font-family="Arial">PX1 robot</text><line x1="220" y1="185" x2="900" y2="185" stroke="#d97706" stroke-width="5"/><text x="490" y="175" font-size="17" font-family="Arial" fill="#d97706">1  +24 V</text><line x1="220" y1="233" x2="900" y2="233" stroke="#64748b" stroke-width="5"/><text x="490" y="223" font-size="17" font-family="Arial" fill="#64748b">2  DC return</text><line x1="220" y1="281" x2="900" y2="281" stroke="#2563eb" stroke-width="5"/><text x="490" y="271" font-size="17" font-family="Arial" fill="#2563eb">3  RS-485 A</text><line x1="220" y1="329" x2="900" y2="329" stroke="#0891b2" stroke-width="5"/><text x="490" y="319" font-size="17" font-family="Arial" fill="#0891b2">4  RS-485 B</text><line x1="220" y1="377" x2="900" y2="377" stroke="#16a34a" stroke-width="5"/><text x="490" y="367" font-size="17" font-family="Arial" fill="#16a34a">5  CVBS</text><line x1="220" y1="425" x2="900" y2="425" stroke="#7c3aed" stroke-width="5"/><text x="490" y="415" font-size="17" font-family="Arial" fill="#7c3aed">6  Video return</text><text x="30" y="485" font-size="16" font-family="Arial">DC: 24 V / 3.7 A / 2.5 mm² / 60°C (assumed) → 21.60 V robot, 8.87 W cable loss</text><text x="30" y="512" font-size="16" font-family="Arial">CVBS: assumed 100 pF/m → 4 nF; lumped RC 5 MHz amplitude ratio 0.208 (NOT image quality)</text><text x="30" y="539" font-size="16" font-family="Arial">RS-485: 115200 baud, assumed 0.20 µs one-way delay; BER/EMI NOT_RUN, PHYSICAL_CHECK</text></svg>