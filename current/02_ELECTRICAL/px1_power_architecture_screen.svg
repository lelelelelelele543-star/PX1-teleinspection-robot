<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430"><rect width="1000" height="430" fill="white"/><g font-family="Arial" fill="#203449"><text x="30" y="42" font-size="24" font-weight="bold">PX1 40 m tether — power architecture comparison</text><text x="30" y="70" font-size="15">DESIGN ASSUMPTIONS: copper 2.5 mm² supply/return, 60 C, loop R = 0.648 ohm</text></g><g fill="#e8f2fb" stroke="#345b7d" stroke-width="2"><rect x="35" y="115" width="190" height="80" rx="8"/><rect x="400" y="115" width="210" height="80" rx="8"/><rect x="775" y="115" width="190" height="80" rx="8"/><rect x="35" y="245" width="190" height="80" rx="8"/><rect x="400" y="245" width="210" height="80" rx="8"/><rect x="775" y="245" width="190" height="80" rx="8"/></g><g stroke="#345b7d" stroke-width="3"><path d="M225 155H400 M610 155H775 M225 285H400 M610 285H775"/></g><g fill="#203449" font-family="Arial" font-size="16" text-anchor="middle"><text x="130" y="145">24 V source</text><text x="130" y="170">3.70 A</text><text x="505" y="145">40 m loop</text><text x="505" y="170">8.87 W loss</text><text x="870" y="145">Robot bus</text><text x="870" y="170">21.60 V</text><text x="130" y="275">36 V source</text><text x="130" y="300">2.89 A</text><text x="505" y="275">40 m loop</text><text x="505" y="300">5.42 W loss</text><text x="870" y="275">DC/DC input</text><text x="870" y="300">34.13 V</text></g><g fill="#4c5b6d" font-family="Arial" font-size="14"><text x="35" y="218">Case A: constant 3.7 A, robot receives only 79.93 W (not 88.8 W).</text><text x="35" y="348">Case B: 88.8 W regulated output at assumed 90% DC/DC efficiency; converter NOT selected.</text><text x="35" y="377">PASS: arithmetic / energy balance. NOT_RUN: motor startup, converter limits, CVBS, RS-485.</text><text x="35" y="404">PHYSICAL_CHECK: cable heating, pressure feedthrough, EMC. Not approved for manufacturing.</text></g></svg>