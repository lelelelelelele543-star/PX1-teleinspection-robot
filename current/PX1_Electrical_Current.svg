<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840"><rect width="1200" height="840" fill="white" /><style>text{font-family:DejaVu Sans,sans-serif;fill:#182d39}.title{font-size:25px;font-weight:700}.label{font-size:16px}.small{font-size:13px}.wire{fill:none;stroke-width:2.5}.box{fill:#eff4f6;stroke:#617784;stroke-width:1.5}</style><text x="30" y="39" class="title">PX1 · соединения готовых модулей</text><text x="30" y="65" class="small">HOLD · функциональная схема. Логические номера контактов; физическая нумерация вставок не подтверждена.</text><path d="M260 150 H365" class="wire" stroke="#b8492d" /><text x="267" y="117" class="small">1 HV+</text><text x="267" y="138" class="small">2 RETURN</text><path d="M615 150 H810 M745 150 V385 H810 M745 272 H810" class="wire" stroke="#b8492d" /><text x="646" y="137" class="small">24 V</text><path d="M260 310 H365" class="wire" stroke="#347b94" /><text x="267" y="298" class="small">3 A / 4 B</text><path d="M490 350 V400" class="wire" stroke="#347b94" /><text x="498" y="380" class="small">TXD / RXD</text><path d="M260 615 H365" class="wire" stroke="#728639" /><text x="266" y="582" class="small">5 VIDEO+</text><text x="266" y="603" class="small">6 VIDEO−</text><path d="M615 615 H810" class="wire" stroke="#728639" /><text x="639" y="603" class="small">CVBS / return</text><path d="M710 453 H765 V561 H810" class="wire" stroke="#347b94" /><text x="690" y="548" class="small">UART5</text><path d="M980 315 V329 H1166 V583 H1150" class="wire" stroke="#b8492d" /><path d="M810 392 H728 V420 H710" class="wire" stroke="#b8492d" /><rect x="30" y="100" width="230" height="100" rx="4" class="box" /><text x="42" y="125" class="label">CCU · изолированный БП</text><text x="42" y="147" class="small">100–120 VDC → DC защита</text><text x="42" y="169" class="small">Аппаратное отключение</text><text x="42" y="191" class="small">Источник и номиналы HOLD</text><rect x="365" y="100" width="250" height="100" rx="4" class="box" /><text x="377" y="125" class="label">Cincon CQB150W110S24</text><text x="377" y="147" class="small">Вход 43–160 VDC</text><text x="377" y="169" class="small">Выход 24 V / 6.3 A</text><text x="377" y="191" class="small">THT-монтаж / тепло HOLD</text><rect x="810" y="100" width="340" height="100" rx="4" class="box" /><text x="822" y="125" class="label">24 V → 2 × Pololu 2992</text><text x="822" y="147" class="small">Отдельная защита каждой ветви</text><text x="822" y="169" class="small">OUTA / OUTB → 2 мотора 5707</text><text x="822" y="191" class="small">SLP = LOW до разрешения</text><rect x="810" y="230" width="340" height="85" rx="4" class="box" /><text x="822" y="255" class="label">Pololu 5577 · 24 → 12 V</text><text x="822" y="277" class="small">Защита ветви → +12V_HEAD</text><text x="822" y="299" class="small">Готовая плата; не подключать к HV</text><rect x="810" y="345" width="340" height="85" rx="4" class="box" /><text x="822" y="370" class="label">Pololu 5571 · 24 → 5 V</text><text x="822" y="392" class="small">5 V → WeAct VCC</text><text x="822" y="414" class="small">VDD3V3 не является входом 5 V</text><rect x="30" y="270" width="230" height="80" rx="4" class="box" /><text x="42" y="295" class="label">CCU · Waveshare 27479</text><text x="42" y="317" class="small">Изолированный RS485</text><text x="42" y="339" class="small">Автоматическое направление</text><rect x="365" y="270" width="250" height="80" rx="4" class="box" /><text x="377" y="295" class="label">Crawler · Waveshare 27479</text><text x="377" y="317" class="small">TXD ↔ PC10, RXD ↔ PC11</text><text x="377" y="339" class="small">Локальная логика 3.3 V</text><rect x="365" y="400" width="345" height="100" rx="4" class="box" /><text x="377" y="425" class="label">WeAct STM32F446RET6 V1.1</text><text x="377" y="447" class="small">USART3: tether; UART5: камера</text><text x="377" y="469" class="small">I2C PB8/PB9 → MPRLS 0x18</text><text x="377" y="491" class="small">PWM / DIR / SLP / FLT: см. таблицу</text><rect x="30" y="565" width="230" height="100" rx="4" class="box" /><text x="42" y="590" class="label">CCU · балун → CVBS</text><text x="42" y="612" class="small">Delta-Opti TR-1D*P2</text><text x="42" y="634" class="small">Монитор / OSD</text><text x="42" y="656" class="small">1 блок из пары</text><rect x="365" y="565" width="250" height="100" rx="4" class="box" /><text x="377" y="590" class="label">Crawler · балун</text><text x="377" y="612" class="small">CVBS → балансное видео</text><text x="377" y="634" class="small">CVBS return отдельной жилой</text><text x="377" y="656" class="small">1 блок из пары</text><rect x="810" y="535" width="340" height="130" rx="4" class="box" /><text x="822" y="560" class="label">SP13 → отдельная камера</text><text x="822" y="582" class="small">1: +12 V; 2: GND</text><text x="822" y="604" class="small">3: crawler TX → head RX</text><text x="822" y="626" class="small">4: head TX → crawler RX</text><text x="822" y="648" class="small">5: CVBS; 6: CVBS return</text><text x="30" y="733" class="small">Основной tether: ровно 6 медных жил в одном профессиональном усиленном кабеле; коаксиала нет.</text><text x="30" y="755" class="small">Локальный жгут камеры: ровно 6 жил LAPP0028679. Силовой ток не должен возвращаться по цепи CVBS.</text><text x="30" y="777" class="small">Показаны соединения модулей. Защита рекуперации, номиналы DC-защиты и полный монтаж камеры остаются HOLD.</text><text x="30" y="799" class="small">Полная карта MCU и условия SLP/FAULT/I2C — ELECTRICAL_Current.md. Статус изготовления: HOLD.</text></svg>