label">Сухой корпус crawler</text><text x="437" y="342" class="small">Боковые O-ring 190×1.5</text><text x="437" y="364" class="small">Фланцы O-ring 32×1.5</text><text x="437" y="386" class="small">Крышка O-ring 110×1.5</text><text x="437" y="408" class="small">6 × X-ring 18.72×2.62</text><rect x="845" y="295" width="305" height="120" rx="4" class="box"/><text x="857" y="320" class="label">MPRLS · абсолютное давление</text><text x="857" y="342" class="small">p_изб = p_abs − p_атм</text><text x="857" y="364" class="small">Базу хранить до наполнения</text><text x="857" y="386" class="small">Не обнулять при перезапуске</text><text x="857" y="408" class="small">Связь со всеми полостями HOLD</text><rect x="425" y="520" width="295" height="120" rx="4" class="box"/><text x="437" y="545" class="label">Граница жгута</text><text x="437" y="567" class="small">M12 гермоввод + SP13</text><text x="437" y="589" class="small">6 изолированных жил</text><text x="437" y="611" class="small">Продольная герметичность</text><text x="437" y="633" class="small">разделки / вставки HOLD</text><rect x="35" y="510" width="265" height="130" rx="4" class="box"/><text x="47" y="535" class="label">Отдельный объём камеры</text><text x="47" y="557" class="small">Свои поворотные уплотнения</text><text x="47" y="579" class="small">Свой контроль / наполнение</text><text x="47" y="601" class="small">Объёмы нельзя объединять</text><text x="47" y="623" class="small">водяным каналом по жгуту</text><rect x="845" y="520" width="305" height="120" rx="4" class="box"/><text x="857" y="545" class="label">Колёсные валы</text><text x="857" y="567" class="small">Подшипник61903 17×30×7</text><text x="857" y="589" class="small">X-ring по валу Ø18</text><text x="857" y="611" class="small">Профиль канавки: H03</text><text x="857" y="633" class="small">Крепление колеса: H01</text><text x="30" y="733" class="small">Оригинальные паспортные 1 bar Proteus не присваиваются PX1. CAD не является испытанием на утечку.</text><tex