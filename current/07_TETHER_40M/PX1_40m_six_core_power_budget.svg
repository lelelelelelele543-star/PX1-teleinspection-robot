<text x="38" y="453" font-family="Arial" font-size="15">1.00 mm²: Rloop = 1.40 Ω; at 2 A: ΔV = 2.80 V; load = 21.20 V  → PASS voltage only</text>
<text x="38" y="489" font-family="Arial" font-size="14" fill="#b91c1c">NOT_RUN: RS485 bit-error/EMC, CVBS image quality/reflections; PHYSICAL_CHECK: cable heating</text>
