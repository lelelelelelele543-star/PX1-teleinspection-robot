<text x="58" y="143" font-family="Arial" font-size="18" font-weight="bold">Console / reel</text>
<text x="783" y="143" font-family="Arial" font-size="18" font-weight="bold">PX1 robot</text>
<text x="56" y="170" font-family="Arial" font-size="13">24 V assumed</text>
<text x="780" y="170" font-family="Arial" font-size="13">DC/DC + drives</text>
