<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590"><rect width="1000" height="590" fill="#f7f9fc"/><style>text{font-family:Arial,sans-serif;fill:#17243b}.title{font-size:26px;font-weight:bold}.note{font-size:15px}.dim{font-size:17px;fill:#2563eb}</style><text x="42" y="47" class="title">PX1 A7 — motor cradle / параметрический эскиз</text><text x="42" y="76" class="note">DESIGN ASSUMPTIONS • не измерения Proteus • не CAD-рендер</text><text x="90" y="120" font-size="20">Вид сверху (мм)</text><rect x="100" y="150" width="440" height="260" fill="#d8e2ee" stroke="#233955" stroke-width="3"/><rect x="220" y="150" width="40" height="260" fill="#8babc9" stroke="#233955"/><rect x="380" y="150" width="40" height="260" fill="#8babc9" stroke="#233955"/><g fill="#fff" stroke="#243b53" stroke-width="3"><circle cx="150" cy="205" r="16"/><circle cx="150" cy="355" r="16"/><circle cx="490" cy="205" r="16"/><circle cx="490" cy="355" r="16"/></g><text x="250" y="443" class="dim">44 mm</text><text x="55" y="285" class="dim">26</text><text x="130" y="477" class="note">4× Ø3.2; центры X=5/39, Y=±9.5</text><text x="620" y="120" font-size="20">Сечение V-опоры (мм)</text><path d="M640 370 L640 220 L750 290 L860 220 L860 370 Z" fill="#8babc9" stroke="#233955" stroke-width="3"/><rect x="620" y="370" width="260" height="30" fill="#d8e2ee" stroke="#233955" stroke-width="3"/><path d="M640 220 L750 290 L860 220" fill="none" stroke="#2563eb" stroke-width="4"/><text x="656" y="431" class="note">основание T=3; V-опоры X=12–16 и 28–32</text><text x="656" y="458" class="note">V: центр Z=5; края Z=12 при Y=±11</text><text x="42" y="533" class="note">Условный двигатель Ø24 не построен; ремни/хомуты, резьбы и фактические посадки не проверены.</text><text x="42" y="558" class="note">FreeCAD macro строит твердотельную геометрию из этих параметров; STEP/STL только после запуска макроса.</text></svg>