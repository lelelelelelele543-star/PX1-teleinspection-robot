<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460"><rect width="1120" height="460" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#142338}.h{font-size:23px;font-weight:bold}.t{font-size:16px}.small{font-size:14px;fill:#475569}.gear{fill:#fbbf24;stroke:#92400e;stroke-width:2}.wheel{fill:#10b981;stroke:#065f46;stroke-width:2}</style><text x="35" y="42" class="h">PX1 M1 — coordinate integration / five Z50 stations per side</text><text x="35" y="68" class="small">Dimensioned parameter schematic, NOT FreeCAD render. One side shown; mirror for opposite side.</text><line x1="110" y1="174" x2="1010" y2="174" stroke="#64748b" stroke-width="3"/><text x="36" y="124" class="t">CAD X (mm)</text><text x="36" y="303" class="t">Graph X (mm)</text><g><circle class="gear" cx="200" cy="174" r="34"/><text x="200" y="180" font-size="15" text-anchor="middle">Z50</text><text x="200" y="236" text-anchor="middle" class="t">-110</text><text x="200" y="333" text-anchor="middle" class="t">50</text><rect class="wheel" x="160" y="80" width="80" height="34" rx="7"/><text x="200" y="103" text-anchor="middle" fill="#fff">Wheel</text><circle class="gear" cx="390" cy="174" r="34"/><text x="390" y="180" font-size="15" text-anchor="middle">Z50</text><text x="390" y="236" text-anchor="middle" class="t">-55</text><text x="390" y="333" text-anchor="middle" class="t">105</text><circle class="gear" cx="580" cy="174" r="34"/><text x="580" y="180" font-size="15" text-anchor="middle">Z50</text><text x="580" y="236" text-anchor="middle" class="t">0</text><text x="580" y="333" text-anchor="middle" class="t">160</text><rect class="wheel" x="540" y="80" width="80" height="34" rx="7"/><text x="580" y="103" text-anchor="middle" fill="#fff">Wheel</text><circle class="gear" cx="770" cy="174" r="34"/><text x="770" y="180" font-size="15" text-anchor="middle">Z50</text><text x="770" y="236" text-anchor="middle" class="t">55</text><text x="770" y="333" text-anchor="middle" class="t">215</text><circle class="gear" cx="960" cy="174" r="34"/><text x="960" y="180" font-size="15" text-anchor="middle">Z50</text><text x="960" y="236" text-anchor="middle" class="t">110</text><text x="960" y="333" text-anchor="middle" class="t">270</text><rect class="wheel" x="920" y="80" width="80" height="34" rx="7"/><text x="960" y="103" text-anchor="middle" fill="#fff">Wheel</text></g><line x1="200" y1="274" x2="960" y2="274" stroke="#64748b" stroke-width="2"/><text x="35" y="381" class="t">Transform: X(graph) = X(CAD) + 160 mm. Axles at CAD -110 / 0 / 110 → graph 50 / 160 / 270.</text><text x="35" y="408" class="t" fill="#b91c1c">FAIL: graph expects axles 50 / 150 / 250 and gears 50 / 100 / 150 / 200 / 250.</text><text x="35" y="435" class="small">Actual CAD pitch centers 55 mm (m1.1 × Z50); graph centers 50 mm. Requires unified station geometry.</text></svg>