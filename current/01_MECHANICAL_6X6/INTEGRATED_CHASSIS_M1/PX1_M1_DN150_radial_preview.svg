<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650"><rect width="900" height="650" fill="#f7fafc"/><text x="35" y="44" font-size="24" font-family="sans-serif" font-weight="bold">PX1 M1 — DN150 radial envelope (YZ)</text><text x="35" y="72" font-size="15" font-family="sans-serif">DESIGN ASSUMPTIONS, not Proteus measurements. Conservative bounding boxes.</text><circle cx="330" cy="300" r="225" fill="#e4f2ff" stroke="#2070aa" stroke-width="3"/><rect x="210" y="195" width="240" height="210" fill="#a7b5c5" stroke="#35465c" stroke-width="2"/><rect x="156" y="198" width="54" height="234" fill="#f1ae57" stroke="#a85b00" stroke-width="2"/><rect x="450" y="198" width="54" height="234" fill="#f1ae57" stroke="#a85b00" stroke-width="2"/><line x1="330" y1="60" x2="330" y2="540" stroke="#777" stroke-dasharray="5 6"/><line x1="90" y1="300" x2="570" y2="300" stroke="#777" stroke-dasharray="5 6"/><g font-family="sans-serif" font-size="17" fill="#1c2c3a"><text x="625" y="160">Pipe ID: 150 mm</text><text x="625" y="198">Body: 80 × 70 mm</text><text x="625" y="235">Wheel: Ø78 × 18 mm</text><text x="625" y="272">Wheel axle Z = −5 mm</text><text x="625" y="309">Wheel Y: 40 ... 58 mm</text><text x="625" y="346">Radial bound: 72.80 mm</text><text x="625" y="383">Margin: 2.20 mm</text><text x="625" y="440">NOT RUN:</text><text x="625" y="469">3D collisions</text><text x="625" y="496">seal/gear fits</text></g><text x="35" y="600" font-size="15" font-family="sans-serif">Orange rectangles = conservative wheel bounding envelopes, not actual tire geometry. Blue circle = pipe.</text></svg>