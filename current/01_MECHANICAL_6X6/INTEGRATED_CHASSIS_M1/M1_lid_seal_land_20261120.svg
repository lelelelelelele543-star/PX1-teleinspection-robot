<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660">
<rect width="1120" height="660" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#17263a} .dim{font-size:17px}.small{font-size:14px;fill:#45556a}.title{font-size:27px;font-weight:bold}.label{font-size:18px;font-weight:bold}</style>
<text x="38" y="48" class="title">PX1 M1 — lid, aperture, gasket and 8 bolts</text>
<text x="38" y="78" class="small">PARAMETRIC 2D DESIGN ASSUMPTIONS (mm) — NOT a FreeCAD render / NOT pressure-qualified</text>
<!-- plan at 3 px/mm, origin x=365 y=338 -->
<g transform="translate(365 338) scale(3)">
<rect x="-95" y="-39" width="190" height="78" fill="#d8e5f1" stroke="#42617b" stroke-width="0.9"/>
<rect x="-88" y="-33" width="176" height="66" fill="#65bfa3" stroke="#147b64" stroke-width="0.4"/>
<rect x="-85" y="-30" width="170" height="60" fill="#ffffff" stroke="#b55a39" stroke-width="0.8" stroke-dasharray="3 2"/>
<g fill="#34495e" stroke="white" stroke-width="0.45">
<circle cx="-90" cy="-35.5" r="1.7"/><circle cx="0" cy="-35.5" r="1.7"/><circle cx="90" cy="-35.5" r="1.7"/>
<circle cx="-90" cy="35.5" r="1.7"/><circle cx="0" cy="35.5" r="1.7"/><circle cx="90" cy="35.5" r="1.7"/>
<circle cx="-90" cy="0" r="1.7"/><circle cx="90" cy="0" r="1.7"/>
</g></g>
<text x="365" y="220" text-anchor="middle" class="label">170 × 60 aperture</text>
<text x="365" y="246" text-anchor="middle" class="small">white region = open cavity</text>
<text x="365" y="480" text-anchor="middle" class="dim">190 × 78 lid, 176 × 66 outer gasket</text>
<text x="365" y="508" text-anchor="middle" class="small">Gasket inner 170 × 60, supported by nominal 3 mm flange</text>
<g transform="translate(730 132)">
<rect x="0" y="0" width="350" height="402" rx="12" fill="#eef3f8" stroke="#cbd5e1"/>
<text x="18" y="36" class="label">Analytical interface checks</text>
<text x="18" y="79" class="dim">PASS: gasket inner = aperture</text>
<text x="18" y="117" class="dim">PASS: ring width = 3 mm</text>
<text x="18" y="155" class="dim">PASS: 8 M3 hole locations</text>
<text x="18" y="193" class="dim">Hole-to-ring clearance:</text>
<text x="35" y="221" class="dim">X = 0.30 mm, Y = 0.80 mm</text>
<text x="18" y="262" class="dim">Head-to-lid edge:</text>
<text x="35" y="290" class="dim">X = 2.20 mm, Y = 0.70 mm</text>
<text x="18" y="332" class="small">NOT_RUN: FreeCAD / clamp load</text>
<text x="18" y="358" class="small">PHYSICAL_CHECK: 0.4–0.7 bar</text>
</g>
<text x="38" y="600" class="small">Green = gasket ring; grey-blue = lid flange; dark dots = clearance holes. Geometry derived from M1 source parameters.</text>
<text x="38" y="628" class="small">No assertion of leak-tightness, gasket extrusion resistance or screw strength.</text>
</svg>