ct x="849" y="202" width="146" height="130" rx="4" class="shell"/><rect x="810" y="194" width="27" height="146" class="wheel"/><rect x="1007" y="194" width="27" height="146" class="wheel"/><rect x="837" y="243" width="12" height="48" class="seal"/><rect x="995" y="243" width="12" height="48" class="seal"/><text x="792" y="435" class="note">Conservative radius: √(60² + 39²)</text><text x="792" y="459" class="note">= 71.56 mm</text><text x="792" y="483" class="note">Nominal margin: 3.44 mm</text><text x="38" y="552" class="sub">SOURCE PARAMETERS: wheel_W=14, wheel_D=78, wheel inner Y=46, outer Y=60, Z=0.</text><text x="38" y="579" class="note">Previously the FreeCAD wheel cylinder was hardcoded to 18 mm while all clearance checks used 14 mm.</text><text x="38" y="606" class="note">Corrected: cylinder length now reads wheel_W, with bounding-box assertions for all six wheel solids.</text><text x="38" y="641" class="note">NOT_RUN: FreeCAD execution, STEP reopen, full 3D collision audit. PHYSICAL_CHECK: shaft seals 0.4–0.7 bar.</text></svg>