<svg xmlns="http://www.w3.org/2000/svg" width="950" height="560" viewBox="0 0 950 560"><rect width="950" height="560" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="24" font-weight="bold">PX1 M1 — lid/gasket/fastener interface audit</text><text x="30" y="65" font-size="15">Dimension-driven 2D drawing (mm), NOT FreeCAD render. DESIGN ASSUMPTIONS.</text><rect x="210" y="162" width="380" height="156" fill="#cbd5e1" stroke="#334155" stroke-width="2"/><rect x="224" y="174" width="352" height="132" fill="#6ee7b7" stroke="#059669" stroke-width="2"/><rect x="230" y="180" width="340" height="120" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><circle cx="220" cy="169" r="5.6" fill="#ef4444" fill-opacity=".25" stroke="#dc2626" stroke-width="2"/><circle cx="220" cy="169" r="2" fill="#991b1b"/><circle cx="220" cy="311" r="5.6" fill="#ef4444" fill-opacity=".25" stroke="#dc2626" stroke-width="2"/><circle cx="220" cy="311" r="2" fill="#991b1b"/><circle cx="400" cy="169" r="5.6" fill="#ef4444" fill-opacity=".25" stroke="#dc2626" stroke-width="2"/><circle cx="400" cy="169" r="2" fill="#991b1b"/><circle cx="400" cy="311" r="5.6" fill="#ef4444" fill-opacity=".25" stroke="#dc2626" stroke-width="2"/><circle cx="400" cy="311" r="2" fill="#991b1b"/><circle cx="580" cy="169" r="5.6" fill="#ef4444" fill-opacity=".25" stroke="#dc2626" stroke-width="2"/><circle cx="580" cy="169" r="2" fill="#991b1b"/><circle cx="580" cy="311" r="5.6" fill="#ef4444" fill-opacity=".25" stroke="#dc2626" stroke-width="2"/><circle cx="580" cy="311" r="2" fill="#991b1b"/><circle cx="220" cy="240" r="5.6" fill="#ef4444" fill-opacity=".25" stroke="#dc2626" stroke-width="2"/><circle cx="220" cy="240" r="2" fill="#991b1b"/><circle cx="580" cy="240" r="5.6" fill="#ef4444" fill-opacity=".25" stroke="#dc2626" stroke-width="2"/><circle cx="580" cy="240" r="2" fill="#991b1b"/><text x="620" y="188" font-size="16">Lid 190 × 78</text><text x="620" y="216" font-size="16">Gasket outer 176 × 66</text><text x="620" y="244" font-size="16">Opening 170 × 60</text><text x="620" y="272" font-size="16">8 × M3, head Ø5.6</text><text x="30" y="380" font-size="19" fill="#b91c1c" font-weight="bold">FAIL: four of eight screw-head envelopes intrude into the gasket footprint.</text><text x="30" y="411" font-size="16">Corner bolt centers (±90, ±35.5): gasket clearance 2.915 mm vs head radius 2.8 mm — PASS nominal.</text><text x="30" y="437" font-size="16" fill="#b91c1c">Middle bolts (0, ±35.5): clearance 2.5 mm vs 2.8 mm — FAIL (2 of 8).</text><text x="30" y="463" font-size="16" fill="#b91c1c">End bolts (±90, 0): clearance 2 mm vs 2.8 mm — FAIL (2 of 8).</text><text x="30" y="500" font-size="15">Other unresolved interfaces: Ø23 seal cartridge has no modeled seat; 0.7 bar seal rating not qualified.</text><text x="30" y="528" font-size="14">This is an interference screening, not pressure, bolt-preload or fabrication approval.</text></g></svg>