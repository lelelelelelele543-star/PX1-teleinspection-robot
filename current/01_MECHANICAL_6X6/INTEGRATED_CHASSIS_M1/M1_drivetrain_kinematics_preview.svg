<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520"><rect width="1100" height="520" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#172334"><text x="30" y="38" font-size="24" font-weight="bold">PX1 M1 — two-side drivetrain kinematics</text><text x="30" y="62" font-size="15">Parameterized 2D schematic; 5 × Z50 each side, 6 wheels, Z16/Z40 input. NOT CAD render.</text></g><g stroke="#9a4b16" stroke-width="3" fill="#f4d1ad"><circle cx="175" cy="170" r="62"/><circle cx="175" cy="330" r="62"/><circle cx="340" cy="170" r="62"/><circle cx="340" cy="330" r="62"/><circle cx="505" cy="170" r="62"/><circle cx="505" cy="330" r="62"/><circle cx="670" cy="170" r="62"/><circle cx="670" cy="330" r="62"/><circle cx="835" cy="170" r="62"/><circle cx="835" cy="330" r="62"/></g><g stroke="#334155" stroke-width="4" fill="none"><circle cx="175" cy="170" r="82"/><circle cx="175" cy="330" r="82"/><circle cx="505" cy="170" r="82"/><circle cx="505" cy="330" r="82"/><circle cx="835" cy="170" r="82"/><circle cx="835" cy="330" r="82"/></g><g font-family="Arial" font-size="16" fill="#172334"><text x="28" y="175">LEFT</text><text x="28" y="335">RIGHT</text><text x="155" y="90">Front</text><text x="825" y="90">Rear</text><text x="880" y="160">Z16 → Z40</text><text x="880" y="186">16/40 = 0.40</text><text x="880" y="330">Motor 66 rpm*</text><text x="880" y="355">Wheel 26.4 rpm*</text><text x="880" y="380">0.108 m/s*</text><text x="30" y="455" font-size="15">* ASSUMED unloaded motor speed, Ø78 mm wheels, zero slip; no efficiency/load correction.</text><text x="30" y="485" font-size="15" fill="#a04416">NOT_RUN: real tooth contact, shaft torque couplings, bearings, dynamic seals, FreeCAD Boolean.</text></g><g fill="#334155"><text x="165" y="175" font-family="Arial" font-size="17">↻</text><text x="165" y="335" font-family="Arial" font-size="17">↻</text><text x="330" y="175" font-family="Arial" font-size="17">↺</text><text x="330" y="335" font-family="Arial" font-size="17">↺</text><text x="495" y="175" font-family="Arial" font-size="17">↻</text><text x="495" y="335" font-family="Arial" font-size="17">↻</text><text x="660" y="175" font-family="Arial" font-size="17">↺</text><text x="660" y="335" font-family="Arial" font-size="17">↺</text><text x="825" y="175" font-family="Arial" font-size="17">↻</text><text x="825" y="335" font-family="Arial" font-size="17">↻</text></g></svg>