<g font-family="Arial" fill="#334155" font-size="15"><text x="30" y="440">Plate thickness 6 | max pocket 4 | remaining web 2 | height 40 | x-length 50</text><text x="30" y="469">Orange = cylindrical subtraction region; blue = assumed motor envelope</text><text x="30" y="498">FreeCAD script performs true solid Boolean cut and STEP export when executed.</text><text x="30" y="523">Not checked: real motor body, bearings, X150 shaft, gear Z50, strength or seals.</text></g></svg>