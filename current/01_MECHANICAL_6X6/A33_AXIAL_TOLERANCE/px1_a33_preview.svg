<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360"><rect width="860" height="360" fill="#fbfcfe"/><g font-family="Arial,sans-serif" fill="#172938"><text x="28" y="32" font-size="21" font-weight="bold">PX1 A33 — X150 axial tolerance stack</text><text x="28" y="55" font-size="13">Parametric 2D dimension diagram; ALL dimensions assumed, mm</text><rect x="75" y="125" width="176" height="78" fill="#76a9bc" stroke="#233040"/><text x="163" y="115" font-size="11" text-anchor="middle">Bearing L</text><rect x="251" y="125" width="44" height="78" fill="#8bbf8a" stroke="#233040"/><text x="273" y="115" font-size="11" text-anchor="middle">Spacer L</text><rect x="295" y="125" width="176" height="78" fill="#e4b568" stroke="#233040"/><text x="383" y="115" font-size="11" text-anchor="middle">Z50 gear</text><rect x="471" y="125" width="44" height="78" fill="#8bbf8a" stroke="#233040"/><text x="493" y="115" font-size="11" text-anchor="middle">Spacer R</text><rect x="515" y="125" width="176" height="78" fill="#76a9bc" stroke="#233040"/><text x="603" y="115" font-size="11" text-anchor="middle">Bearing R</text><line x1="75" y1="90" x2="75" y2="232" stroke="#bd5b4e" stroke-width="3"/><line x1="704.2" y1="90" x2="704.2" y2="232" stroke="#bd5b4e" stroke-width="3"/><line x1="691" y1="220" x2="704.2" y2="220" stroke="#bd5b4e" stroke-width="2"/><text x="697.6" y="244" text-anchor="middle" font-size="11">0.60</text><text x="28" y="280" font-size="14">Stack: 28.00 ± 0.40 mm; retainer-face span: 28.60 ± 0.15 mm</text><text x="28" y="303" font-size="14" font-weight="bold">Worst-case axial clearance: 0.05 … 1.15 mm (nominal 0.60)</text><text x="28" y="327" font-size="12">Red faces represent idealized retainers, NOT DIN 471 groove geometry.</text><text x="28" y="345" font-size="12">Bearing inner-race contact, preload, clip deformation, gear backlash: NOT validated.</text></g></svg>