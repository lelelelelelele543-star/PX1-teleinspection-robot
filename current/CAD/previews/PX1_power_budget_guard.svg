<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 470"><rect width="1050" height="470" fill="#f8fafc"/>
<text x="32" y="43" font-size="25" font-family="sans-serif">PX1 / integrated load budget / 40 m six-core tether</text>
<text x="32" y="71" font-size="15" font-family="sans-serif">PARAMETRIC ELECTRICAL 2D / load currents are assumptions, not measured ratings</text>
