e: undervoltage cutout + independent overcurrent protection</text><text x="355" y="374" font-size="17" font-family="Arial">Firmware only cannot disconnect a 5 A auxiliary load.</text><text x="355" y="402" font-size="15" font-family="Arial">NOT_RUN: MCU, current sensors, transients. PHYSICAL_CHECK: cable heating.</text><text x="40" y="472" font-size="14" font-family="Arial" fill="#475569">Source: PX1_power_allocator.py • no new CAD geometry • manufacturing release: NO</text></svg>