<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><rect width="1100" height="640" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#152638"><text x="45" y="47" font-size="27" font-weight="bold">PX1 · единый мастер · проверка привода и корпуса</text><text x="45" y="75" font-size="15">Параметрическая 2D-схема по текущим константам мастера; НЕ CAD-рендер / НЕ производственный чертёж</text><text x="45" y="115" font-size="20">Вид сверху — X вдоль корпуса, Y поперёк</text></g><g transform="translate(100 155) scale(2.65)"><rect x="11" y="0" width="278" height="68" rx="7" fill="#dce8f2" stroke="#32516a" stroke-width="1.2"/><g fill="#6d8fa6" stroke="#23425a" stroke-width=".8"><rect x="91.6" y="7.5" width="97.9" height="26" rx="4"/><rect x="91.6" y="34.5" width="97.9" height="26" rx="4"/></g><g fill="#efbb66" stroke="#8c5d20" stroke-width=".8"><circle cx="50" cy="-20.5" r="17"/><circle cx="150" cy="-20.5" r="17"/><circle cx="250" cy="-20.5" r="17"/><circle cx="50" cy="88.5" r="17"/><circle cx="150" cy="88.5" r="17"/><circle cx="250" cy="88.5" r="17"/></g><g stroke="#ba4555" stroke-width=".7" fill="none" stroke-dasharray="3 2"><path d="M50 0V68 M100 0V68 M150 0V68 M200 0V68 M250 0V68"/></g></g><g font-family="Arial,sans-serif" fill="#20384e"><text x="45" y="450" font-size="18" font-weight="bold">Проверяемые параметры</text><text x="45" y="480" font-size="16">Корпус 278 × 68 мм (габаритная оценка); 6 колёс X=50/150/250</text><text x="45" y="505" font-size="16">10 шестерён Z50, шаг 50 мм; два мотора, X≈91,6–189,5 мм</text><text x="45" y="530" font-size="16">Межмоторный номинальный зазор ≈1 мм — требует 3D-проверки</text><text x="45" y="565" font-size="16" fill="#a14536">BLOCKER: тип двигателя / драйвер BTS7960; разъём SP13; герметизация 0,7 бар</text><text x="45" y="602" font-size="14">Схема отображает габаритные envelopes, не зубья, крепёж или фактические коллизии.</text></g></svg>