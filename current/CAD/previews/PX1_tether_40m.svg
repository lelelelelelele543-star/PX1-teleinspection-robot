<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490">
<rect width="1100" height="490" fill="#f8fafc"/>
<text x="30" y="40" font-size="25" font-family="sans-serif">PX1 / 40m / six-core tether</text>
<text x="30" y="67" font-size="15" font-family="sans-serif">PARAMETRIC 2D electrical schematic; assumed 1.5 mm2 copper cores, not OEM cable geometry</text>
<text x="30" y="115" font-family="sans-serif" font-size="17">1: DC +24V</text>
<line x1="320" y1="110" x2="820" y2="110" stroke="#b91c1c" stroke-width="5"/>
<text x="30" y="163" font-family="sans-serif" font-size="17">2: DC return</text>
<line x1="320" y1="158" x2="820" y2="158" stroke="#1d4ed8" stroke-width="5"/>
<text x="30" y="211" font-family="sans-serif" font-size="17">3: RS485 A</text>
<line x1="320" y1="206" x2="820" y2="206" stroke="#059669" stroke-width="5"/>
<text x="30" y="259" font-family="sans-serif" font-size="17">4: RS485 B</text>
<line x1="320" y1="254" x2="820" y2="254" stroke="#047857" stroke-width="5"/>
<text x="30" y="307" font-family="sans-serif" font-size="17">5: CVBS balanced +</text>
<line x1="320" y1="302" x2="820" y2="302" stroke="#9333ea" stroke-width="5"/>
<text x="30" y="355" font-family="sans-serif" font-size="17">6: CVBS balanced -</text>
<line x1="320" y1="350" x2="820" y2="350" stroke="#7c3aed" stroke-width="5"/>
<rect x="300" y="85" width="540" height="288" rx="12" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
<text x="30" y="427" font-family="sans-serif" font-size="16">40m DC loop: 0.933 ohm; 2A -&gt; 1.867V drop, 3.733W loss (20 C assumptions)</text>
<text x="30" y="461" font-family="sans-serif" font-size="15" fill="#b45309">NOT_RUN: CVBS video quality, RS485 EMI, motor peak load. PHYSICAL_CHECK: cable and pressure entry.</text>
</svg>
